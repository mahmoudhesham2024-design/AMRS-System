<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRS - لوحة الإدارة الشاملة</title>
    <!-- مكتبات فايربيز -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-right: 5px solid #38bdf8; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; text-align: center; }
        input, select { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; }
        .btn { background: #38bdf8; color: #0f172a; padding: 12px; width: 100%; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 16px; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; }
        .item-box { background: #334155; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #0ea5e9; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; width: 300px; text-align: center; border-top: 5px solid #38bdf8; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول (الباسورد) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔐 دخول الإدارة</h2>
            <p style="font-size: 13px; color: #94a3b8;">ادخل كلمة مرور الأدمن</p>
            <input type="password" id="adminPass" placeholder="كلمة المرور (افتراضي: 1234)">
            <button class="btn" onclick="checkLogin()">دخول للسيستم</button>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <h1>🚗 AMRS (لوحة التحكم السحابية الشاملة)</h1>
        
        <!-- قسم الأسطول -->
        <div class="card" style="border-color: #10b981;">
            <h2>🚙 إدارة أسطول السيارات</h2>
            <div id="carsList">جاري التحميل...</div>
            <hr style="border-color: #334155; margin: 15px 0;">
            <input type="text" id="newCarName" placeholder="اسم ورقم السيارة (مثال: كيا سيراتو - أى 1234)">
            <button class="btn" style="background:#10b981; color:#fff;" onclick="addCar()">إضافة سيارة للأسطول ☁️</button>
        </div>

        <!-- قسم العقود والأرباح -->
        <div class="card">
            <h2>📝 تسجيل عقد إيجار وحساب الأرباح</h2>
            <input type="text" id="clientName" placeholder="اسم العميل">
            <input type="tel" id="clientPhone" placeholder="رقم تليفون العميل">
            <select id="carSelect"><option value="">-- اختار السيارة المتاحة --</option></select>
            <input type="number" id="rentalPrice" placeholder="قيمة الإيجار (جنيه)">
            <label style="font-size:12px; color:#94a3b8;">تاريخ ووقت انتهاء العقد (عودة السيارة):</label>
            <input type="datetime-local" id="endDate">
            <button class="btn" onclick="addContract()">تفاويض العقد وحجز السيارة 🚀</button>
        </div>

        <!-- قسم المخالفات -->
        <div class="card" style="border-color: #f59e0b;">
            <h2>⚠️ تسجيل مخالفة أو غرامة</h2>
            <input type="text" id="violationCar" placeholder="اسم السيارة المخالفة">
            <input type="text" id="violationDesc" placeholder="تفاصيل المخالفة (سرعة، ركن خاطئ...)">
            <input type="number" id="violationCost" placeholder="قيمة الغرامة (جنيه)">
            <button class="btn" style="background:#f59e0b; color:#0f172a;" onclick="addViolation()">إثبات المخالفة 🚨</button>
        </div>

        <!-- قسم الأرشيف والدخل -->
        <div class="card" style="border-color: #ec4899;">
            <h2>💰 أرشيف الدخل والحسابات</h2>
            <div id="incomeList">جاري تحميل الأرشيف...</div>
            <h3 style="margin-top:15px; color:#10b981;">إجمالي الدخل المحقق: <span id="totalIncome">0</span> جنيه</h3>
        </div>
    </div>

    <script>
        // باسورد الإدارة (يمكنك تغييره هنا)
        const ADMIN_PIN = "1234";

        function checkLogin() {
            let val = document.getElementById('adminPass').value;
            if(val === ADMIN_PIN) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        // إعدادات فايربيز
        const firebaseConfig = {
            apiKey: "AIzaSyAGdC-CfyaUiftoLyn2Zx2lWX2CeD-ojPc",
            authDomain: "amrs-1b4ab.firebaseapp.com",
            projectId: "amrs-1b4ab",
            storageBucket: "amrs-1b4ab.firebasestorage.app",
            messagingSenderId: "675822216625",
            appId: "1:675822216625:web:8371b50461e7ebb2334990"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // جلب السيارات لايف
        db.collection("cars").onSnapshot((snapshot) => {
            const list = document.getElementById('carsList');
            const select = document.getElementById('carSelect');
            list.innerHTML = ''; select.innerHTML = '<option value="">-- اختار السيارة --</option>';
            
            snapshot.forEach(doc => {
                let car = doc.data();
                list.innerHTML += `<div class="item-box"><span><b>${car.name}</b></span> <button onclick="deleteCar('${doc.id}')" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:5px; cursor:pointer;">حذف</button></div>`;
                select.innerHTML += `<option value="${car.name}">${car.name}</option>`;
            });
            if(list.innerHTML === '') list.innerHTML = 'لا توجد سيارات مسجلة حالياً.';
        });

        async function addCar() {
            let name = document.getElementById('newCarName').value;
            if(!name) return alert('اكتب اسم العربية!');
            await db.collection("cars").add({ name: name, createdAt: new Date() });
            document.getElementById('newCarName').value = '';
            alert('تمت إضافة السيارة بنجاح!');
        }

        async function deleteCar(id) {
            if(confirm('متأكد من حذف هذه السيارة؟')) {
                await db.collection("cars").doc(id).delete();
            }
        }

        async function addContract() {
            let name = document.getElementById('clientName').value;
            let phone = document.getElementById('clientPhone').value;
            let car = document.getElementById('carSelect').value;
            let price = Number(document.getElementById('rentalPrice').value);
            let endDate = document.getElementById('endDate').value;

            if(!name || !car || !endDate || !price) return alert('برجاء ملء جميع بيانات العقد والأرباح!');

            // 1. تسجيل العقد النشط
            await db.collection("contracts").add({
                clientName: name,
                clientPhone: phone,
                carName: car,
                endDate: endDate,
                status: 'نشط'
            });

            // 2. تسجيل الدخل تلقائياً في الأرشيف
            await db.collection("income").add({
                carName: car,
                amount: price,
                client: name,
                date: new Date().toLocaleDateString('ar-EG')
            });

            alert('تم تسجيل العقد، وحساب الدخل أوتوماتيكياً في الأرشيف! العميل سيراها محجوزة.');
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('rentalPrice').value = '';
        }

        async function addViolation() {
            let car = document.getElementById('violationCar').value;
            let desc = document.getElementById('violationDesc').value;
            let cost = document.getElementById('violationCost').value;

            if(!car || !desc || !cost) return alert('كمل بيانات المخالفة!');

            await db.collection("violations").add({ car, desc, cost, date: new Date().toLocaleDateString('ar-EG') });
            alert('تم تسجيل المخالفة بنجاح.');
            document.getElementById('violationCar').value = '';
            document.getElementById('violationDesc').value = '';
            document.getElementById('violationCost').value = '';
        }

        // أرشيف الدخل والأرباح
        db.collection("income").onSnapshot((snapshot) => {
            const list = document.getElementById('incomeList');
            list.innerHTML = '';
            let total = 0;
            snapshot.forEach(doc => {
                let item = doc.data();
                total += Number(item.amount);
                list.innerHTML += `<div class="item-box"><span>🚗 ${item.carName} (عميل: ${item.client})</span> <span class="badge">+${item.amount} ج.م</span></div>`;
            });
            document.getElementById('totalIncome').innerText = total;
            if(list.innerHTML === '') list.innerHTML = 'لا توجد أرباح مسجلة بعد.';
        });
    </script>
</body>
</html>
