       <!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRS - حجز سيارة</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; }
        .booking-card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 500px; margin: 0 auto; border-top: 5px solid #38bdf8; }
        label { display: block; font-size: 14px; color: #cbd5e1; margin: 15px 0 8px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; }
        .file-upload-box { background: #0f172a; border: 2px dashed #334155; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .btn-submit { background: #10b981; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 25px; }
        .car-status-msg { font-size: 12px; color: #eab308; margin-top: 5px; display: block; }
        .preview-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 AMRS Car Rental</h1>
        <p>احجز سيارتك المفضلة بكل سهولة</p>
    </div>

    <div class="booking-card">
        <label>الاسم الكريم:</label>
        <input type="text" id="custName" placeholder="اكتب اسمك بالكامل">

        <label>رقم الموبايل:</label>
        <input type="tel" id="custPhone" placeholder="رقم تليفونك">

        <label>اختر السيارة المطلوبة:</label>
        <select id="custCar" onchange="onCarSelect()">
            <option value="">-- جاري التحميل... --</option>
        </select>
        <img id="carPreviewImg" class="preview-img">
        <span id="carStatusMsg" class="car-status-msg"></span>

        <label>تاريخ الاستلام:</label>
        <input type="datetime-local" id="custStartDate">

        <label>تاريخ الإرجاع:</label>
        <input type="datetime-local" id="custEndDate">

        <label>📄 صورة رخصة القيادة أو الباسبور:</label>
        <div class="file-upload-box">
            <input type="file" id="idFile" accept="image/*" onchange="convertImg(this, 'idStatus')">
            <span id="idStatus" style="font-size: 11px; color: #38bdf8;">لم يتم اختيار ملف</span>
        </div>

        <label>✈️ تذكرة السفر (إن وجدت):</label>
        <div class="file-upload-box">
            <input type="file" id="ticketFile" accept="image/*" onchange="convertImg(this, 'ticketStatus')">
            <span id="ticketStatus" style="font-size: 11px; color: #38bdf8;">لم يتم اختيار ملف</span>
        </div>

        <button class="btn-submit" onclick="submitBooking()">إرسال طلب الحجز للشركة 🚀</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGdC-CfyaUiftoLyn2Zx2lWX2CeD-ojPc",
            authDomain: "amrs-1b4ab.firebaseapp.com",
            projectId: "amrs-1b4ab",
            storageBucket: "amrs-1b4ab.firebasestorage.app",
            messagingSenderId: "675822216625",
            appId: "1:675822216625:web:8371b50461e7ebb2334990"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let idBase64 = "";
        let ticketBase64 = "";
        let contractsData = [];

        async function loadData() {
            const carSelect = document.getElementById('custCar');
            carSelect.innerHTML = '<option value="">-- اختار السيارة --</option>';
            
            const carsSnapshot = await db.collection("cars").get();
            carsSnapshot.forEach(doc => {
                let car = doc.data();
                carSelect.innerHTML += `<option value="${car.name}" data-img="${car.img || ''}">${car.name}</option>`;
            });

            const contractsSnapshot = await db.collection("contracts").where("status", "==", "نشط").get();
            contractsSnapshot.forEach(doc => contractsData.push(doc.data()));
        }

        function convertImg(input, statusId) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    if(statusId === 'idStatus') idBase64 = e.target.result;
                    if(statusId === 'ticketStatus') ticketBase64 = e.target.result;
                    document.getElementById(statusId).innerText = "✅ تم رفعه بنجاح";
                    document.getElementById(statusId).style.color = "#10b981";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function onCarSelect() {
            let select = document.getElementById('custCar');
            let selectedOption = select.options[select.selectedIndex];
            let imgUrl = selectedOption.getAttribute('data-img');
            let imgBox = document.getElementById('carPreviewImg');
            let msgBox = document.getElementById('carStatusMsg');

            if (imgUrl) { imgBox.src = imgUrl; imgBox.style.display = 'block'; }
            else { imgBox.style.display = 'none'; }

            let carName = select.value;
            msgBox.innerHTML = "";
            let activeContract = contractsData.find(c => c.carName === carName);
            if (activeContract) {
                msgBox.style.color = "#eab308";
                msgBox.innerHTML = `⚠️ مؤجرة حالياً حتى: ${new Date(activeContract.endDate).toLocaleString('ar-EG')}`;
            } else if(carName) {
                msgBox.style.color = "#10b981";
                msgBox.innerHTML = `✅ السيارة متاحة.`;
            }
        }

        async function submitBooking() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const car = document.getElementById('custCar').value;
            const startDate = document.getElementById('custStartDate').value;
            const endDate = document.getElementById('custEndDate').value;

            if (!name || !phone || !car || !startDate || !endDate) return alert("برجاء ملء جميع البيانات الأساسية!");

            // رفع الطلب للداشبورد مباشرة
            await db.collection("pendingBookings").add({
                name: name,
                phone: phone,
                car: car,
                startDate: startDate.replace('T', ' '),
                endDate: endDate.replace('T', ' '),
                idImg: idBase64 || "",
                ticketImg: ticketBase64 || "",
                createdAt: new Date()
            });

            alert('تم إرسال طلب الحجز بنجاح! سيتم مراجعته والتواصل معك قريباً.');
            location.reload();
        }

        loadData();
    </script>
</body>
</html>
