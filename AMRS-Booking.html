   <!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMRS - حجز سيارة ذكي</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #38bdf8; margin-bottom: 5px; }
        .booking-card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; border-top: 5px solid #38bdf8; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; font-size: 14px; color: #cbd5e1; margin: 15px 0 8px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; }
        .file-upload-box { background: #0f172a; border: 2px dashed #334155; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .btn-submit { background: #10b981; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
        .btn-track { background: #38bdf8; color: #0f172a; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .preview-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
        .specs-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; color: #38bdf8; display: none; }
        .price-tag { background: #334155; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; font-size: 16px; font-weight: bold; color: #10b981; }
        .track-result { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 AMRS Car Rental</h1>
            <p>أفضل أسعار وتأجير سيارات فوري</p>
        </div>

        <div class="booking-card">
            <h2>📝 حجز سيارة جديدة</h2>
            
            <label>الاسم الكريم:</label>
            <input type="text" id="custName" placeholder="اكتب اسمك بالكامل">

            <label>رقم الموبايل:</label>
            <input type="tel" id="custPhone" placeholder="رقم تليفونك">

            <label>اختر السيارة المطلوبة:</label>
            <select id="custCar" onchange="onCarSelect()">
                <option value="">-- جاري تحميل الأسطول والأسعار... --</option>
            </select>
            <img id="carPreviewImg" class="preview-img">
            <div id="carSpecs" class="specs-box"></div>

            <label>تاريخ ووقت الاستلام:</label>
            <input type="datetime-local" id="custStartDate" onchange="calculateTotal()">

            <label>تاريخ ووقت الإرجاع:</label>
            <input type="datetime-local" id="custEndDate" onchange="calculateTotal()">

            <div id="totalPriceBox" class="price-tag" style="display:none;">
                الإجمالي المتوقع: <span id="totalAmount">0</span> جنيه
            </div>

            <label>📄 صورة رخصة القيادة أو الباسبور:</label>
            <div class="file-upload-box">
                <input type="file" id="idFile" accept="image/*" onchange="convertImg(this, 'idStatus')">
                <span id="idStatus" style="font-size: 11px; color: #38bdf8;">لم يتم اختيار ملف</span>
            </div>

            <label>✈️ تذكرة السفر (إن وجدت):</label>
            <div class="file-upload-box">
                <input type="file" id="ticketFile" accept="image/*" onchange="convertImg(this, 'ticketStatus')">
                <span id="ticketStatus" style="font-size: 11px; color: #38bdf8;">لم يتم اختيار ملف</span>
            </div>

            <button class="btn-submit" onclick="submitBooking()">إرسال طلب الحجز للشركة 🚀</button>
        </div>

        <div class="booking-card" style="border-top-color: #f59e0b;">
            <h2>🔍 تتبع حالة حجزك السابق</h2>
            <label>ادخل رقم الموبايل المسجل به:</label>
            <input type="tel" id="trackPhone" placeholder="رقم الموبايل">
            <button class="btn-track" onclick="trackBooking()">استعلام عن الحالة 🔎</button>
            <div id="trackResultContainer"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGdC-CfyaUiftoLyn2Zx2lWX2CeD-ojPc",
            authDomain: "amrs-1b4ab.firebaseapp.com",
            projectId: "amrs-1b4ab",
            storageBucket: "amrs-1b4ab.firebasestorage.app",
            messagingSenderId: "675822216625",
            appId: "1:675822216625:web:8371b50461e7ebb2334990"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let idBase64 = "";
        let ticketBase64 = "";

        async function loadData() {
            const carSelect = document.getElementById('custCar');
            carSelect.innerHTML = '<option value="">-- اختار السيارة --</option>';
            
            const carsSnapshot = await db.collection("cars").get();
            carsSnapshot.forEach(doc => {
                let car = doc.data();
                carSelect.innerHTML += `<option value="${car.name}" 
                    data-img="${car.img || ''}" 
                    data-pday="${car.pDay || 500}" 
                    data-phalf="${car.pHalf || 7000}" 
                    data-pmonth="${car.pMonth || 13000}">
                    ${car.name} (اليوم: ${car.pDay || 500} ج.م)
                </option>`;
            });
        }

        function convertImg(input, statusId) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    if(statusId === 'idStatus') idBase64 = e.target.result;
                    if(statusId === 'ticketStatus') ticketBase64 = e.target.result;
                    document.getElementById(statusId).innerText = "✅ تم رفعه بنجاح";
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function onCarSelect() {
            let select = document.getElementById('custCar');
            let selectedOption = select.options[select.selectedIndex];
            let imgUrl = selectedOption.getAttribute('data-img');
            let imgBox = document.getElementById('carPreviewImg');
            let specsBox = document.getElementById('carSpecs');

            if (imgUrl) { imgBox.src = imgUrl; imgBox.style.display = 'block'; }
            else { imgBox.style.display = 'none'; }

            if (select.value) {
                specsBox.style.display = 'block';
                specsBox.innerHTML = `💰 <b>الأسعار:</b> يومي: ${selectedOption.getAttribute('data-pday')} ج.م | نصف شهر: ${selectedOption.getAttribute('data-phalf')} ج.م | شهر: ${selectedOption.getAttribute('data-pmonth')} ج.م`;
            } else {
                specsBox.style.display = 'none';
            }
            calculateTotal();
        }

        // حساب الأسعار المتدرجة (أيام، نصف شهر، شهر كامل)
        function calculateTotal() {
            let select = document.getElementById('custCar');
            let selectedOption = select.options[select.selectedIndex];
            
            let pDay = Number(selectedOption.getAttribute('data-pday')) || 500;
            let pHalf = Number(selectedOption.getAttribute('data-phalf')) || (pDay * 14);
            let pMonth = Number(selectedOption.getAttribute('data-pmonth')) || (pDay * 26);
            
            let start = document.getElementById('custStartDate').value;
            let end = document.getElementById('custEndDate').value;
            let priceBox = document.getElementById('totalPriceBox');

            if(start && end && select.value) {
                let startDate = new Date(start);
                let endDate = new Date(end);
                let diffTime = endDate - startDate;
                let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if(diffDays > 0) {
                    let total = 0;
                    
                    // لو المدة شهر أو أكتر (30 يوم فأكثر)
                    let months = Math.floor(diffDays / 30);
                    let remainingDays = diffDays % 30;

                    if(months > 0) {
                        total += months * pMonth;
                    }

                    // لو باقي أيام وصلت لنصف شهر (من 15 لـ 29 يوم)
                    if(remainingDays >= 15) {
                        total += pHalf + ((remainingDays - 15) * pDay);
                    } else {
                        total += remainingDays * pDay;
                    }

                    // لو الحجز أقل من 15 يوم خالص بيتحسب أيام عادية
                    if(diffDays < 15 && diffDays > 0) {
                        total = diffDays * pDay;
                    }

                    document.getElementById('totalAmount').innerText = total;
                    priceBox.style.display = 'block';
                } else {
                    priceBox.style.display = 'none';
                }
            } else {
                priceBox.style.display = 'none';
            }
        }

        async function submitBooking() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const car = document.getElementById('custCar').value;
            const startDate = document.getElementById('custStartDate').value;
            const endDate = document.getElementById('custEndDate').value;

            if (!name || !phone || !car || !startDate || !endDate) return alert("برجاء ملء جميع البيانات الأساسية!");

            await db.collection("pendingBookings").add({
                name: name,
                phone: phone,
                car: car,
                startDate: startDate.replace('T', ' '),
                endDate: endDate.replace('T', ' '),
                idImg: idBase64 || "",
                ticketImg: ticketBase64 || "",
                status: "قيد المراجعة ⏳",
                createdAt: new Date()
            });

            alert('تم إرسال طلب الحجز للشركة بنجاح!');
            location.reload();
        }

        async function trackBooking() {
            let phone = document.getElementById('trackPhone').value;
            let container = document.getElementById('trackResultContainer');
            container.innerHTML = 'جاري البحث...';

            if(!phone) return alert('اكتب رقم الموبايل للاستعلام!');

            let snapshot = await db.collection("pendingBookings").where("phone", "==", phone).get();
            let contractsSnapshot = await db.collection("contracts").where("clientPhone", "==", phone).get();
            
            container.innerHTML = '';
            let found = false;

            snapshot.forEach(doc => {
                let b = doc.data();
                found = true;
                container.innerHTML += `<div class="track-result">🚗 حجز سيارة (${b.car})<br>📅 الحالة: <b style="color:#f59e0b;">قيد المراجعة لدى الإدارة ⏳</b></div>`;
            });

            contractsSnapshot.forEach(doc => {
                let c = doc.data();
                found = true;
                container.innerHTML += `<div class="track-result">🚗 عقد نشط (${c.carName})<br>📅 الحالة: <b style="color:#10b981;">تم القبول والتأكيد بنجاح ✓</b></div>`;
            });

            if(!found) {
                container.innerHTML = '<div class="track-result" style="color:#ef4444;">لا توجد طلبات حجز أو عقود نشطة مسجلة بهذا الرقم.</div>';
            }
        }

        loadData();
    </script>
</body>
</html>
